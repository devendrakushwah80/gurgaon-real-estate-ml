# Render Blueprint for Gurgaon Real Estate ML Backend API
services:
  - type: web
    name: gurgaon-real-estate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
